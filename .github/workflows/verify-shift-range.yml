# Temporary: builds FLASHTnT from this branch in the FLASHApp image and
# compares its modification ranges on FLASHApp's lysate example with those of
# the image's FDmerge build. Removed before merge.
name: Verify shift ranges
on:
  push:
    branches: [claude/project-thread-f24d31]
    paths: [src/openms/source/ANALYSIS/TOPDOWN/**, src/openms/include/OpenMS/ANALYSIS/TOPDOWN/**, .github/workflows/verify-shift-range.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    container: ghcr.io/openms/flashapp:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src-openms
      - name: Build FLASHTnT
        shell: bash
        run: |
          cmake -S src-openms -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH='/usr/;/usr/local' \
            -DHAS_XSERVER=OFF -DBOOST_USE_STATIC=OFF -DOPENMP=ON -DOPENMS_USE_VCPKG=OFF -DWITH_UV=OFF \
            -DWITH_THERMO_RAW=OFF -DPYOPENMS=OFF > cmake.log 2>&1 || (tail -50 cmake.log; exit 1)
          cmake --build build --target FLASHTnT -j "$(nproc)" 2>&1 | grep -E 'error|warning: .*FLASHExtender|Built target' || true
          test -x build/bin/FLASHTnT
      - name: Run both builds on the lysate example
        shell: bash
        run: |
          B=https://raw.githubusercontent.com/OpenMS/FLASHApp/claude/project-thread-f24d31/example-data/workspaces/default
          C=$B/cache/files/example_lysate_identified
          mkdir data && cd data
          curl -sSfLO $C/out_deconv.mzML
          curl -sSfLO $C/database.fasta
          curl -sSfL -o raw.mzML $B/flashtnt/input-files/mzML-files/Label-free_SpikeIn-1x_R1.mzML
          export OPENMS_DATA_PATH=/openms/share/
          for v in old new; do
            if [ $v = old ]; then T=/openms/bin/FLASHTnT; export LD_LIBRARY_PATH=/openms/lib:/root/miniforge3/envs/streamlit-env/lib;
            else T=$GITHUB_WORKSPACE/build/bin/FLASHTnT; export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/lib:/root/miniforge3/envs/streamlit-env/lib; fi
            /usr/bin/time -v $T -in out_deconv.mzML -in_raw raw.mzML -db database.fasta -tag:min_length 4 -tag:max_length 4 \
              -out_pro $v-pro.tsv -out_tag $v-tag.tsv -out_prsm $v-prsm.tsv -threads "$(nproc)" > $v.log 2>&1 || (tail -40 $v.log; exit 1)
            grep -E 'Elapsed|Maximum resident' $v.log
          done
          /root/miniforge3/envs/streamlit-env/bin/python - <<'PY'
          import csv
          def rows(p):
              r = list(csv.DictReader(open(p), delimiter='\t'))
              return {(x['Scan'], x['ProteinAccession'], x['Proforma'].split('[')[0][:12]): x for x in r}, r
          old, oldr = rows('old-pro.tsv'); new, newr = rows('new-pro.tsv')
          print('proteoforms old', len(oldr), 'new', len(newr))
          q = lambda r: sum(1 for x in r if float(x['ProteoformLevelQvalue'] or 1) <= 0.01)
          print('at q <= 0.01: old', q(oldr), 'new', q(newr))
          changed = 0
          for x in newr:
              o = next((y for y in oldr if y['Scan'] == x['Scan'] and y['ProteinAccession'] == x['ProteinAccession']), None)
              if o is None: continue
              if (o['ModStart'], o['ModEnd'], o['Proforma']) != (x['ModStart'], x['ModEnd'], x['Proforma']):
                  changed += 1
                  print('scan', x['Scan'], x['ProteinAccession'][:22])
                  print('  old', o['ModStart'], o['ModEnd'], o['Proforma'][:110], o['Score'])
                  print('  new', x['ModStart'], x['ModEnd'], x['Proforma'][:110], x['Score'])
          print('changed', changed)
          for r, n in ((oldr, 'old'), (newr, 'new')):
              for x in r:
                  if x['Scan'] == '4248': print(n, 'scan 4248', x['ProteinAccession'][:22], x['ModStart'], x['ModEnd'], x['Proforma'][:120])
          PY
