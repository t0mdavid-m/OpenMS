name: Cherry-pick to release
# Opens a backport PR that cherry-picks a merged, patch-labeled `develop` PR onto
# the current release branch (this feeds the weekly patch release).

on:
  # pull_request_target runs in the BASE-repo context, so GITHUB_TOKEN is writable
  # and secrets exist even when the source PR came from a fork. This is safe ONLY
  # because we cherry-pick the already-merged commit and never check out or run
  # PR-head code. Do NOT add `ref: <pr-head>` to the checkout below.
  pull_request_target:
    types: [closed, labeled]   # closed => label-then-merge; labeled => label-after-merge
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged develop PR number to backport (manual / backfill)"
        required: true

permissions:
  contents: write          # push the backport branch
  pull-requests: write     # open, label, and assign the backport PR

jobs:
  backport:
    runs-on: ubuntu-latest
    # Act only on a MERGED develop PR carrying the patch label. On a `labeled` event
    # for a still-open PR, merged==false, so this evaluates to false (no-op).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ( github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'develop' &&
        contains(github.event.pull_request.labels.*.name, vars.PATCH_LABEL || 'patch') )
    steps:
      # Required so the local composite action below exists on disk. The default
      # checkout ref is the base branch (develop), NOT the PR head — keep it that way.
      - uses: actions/checkout@v6            # first-party action, tag-pinned to match repo convention
        with:
          fetch-depth: 0                     # full history so the engine can cherry-pick across branches

      - name: Cherry-pick onto the current release branch
        uses: ./.github/actions/cherry-pick
        with:
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          target-branch: ${{ vars.CURRENT_RELEASE_BRANCH }}   # unset => run fails, by design
