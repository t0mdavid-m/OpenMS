name: Cherry-pick a merged PR onto a branch
description: Cherry-pick a merged PR's commit onto a branch and open a backport PR.

inputs:
  pr-number:
    description: "Merged source PR whose squash commit to cherry-pick"
    required: true
  target-branch:
    description: "Branch to cherry-pick onto (the current release branch)"
    required: true

runs:
  using: composite
  steps:
    # korthout/backport-action pinned to the release tag v3.4.1 (tag pin by request;
    # a commit SHA would be stricter, since tags are mutable — v3.4.1 is a fixed
    # patch tag and should not move).
    - name: Cherry-pick and open backport PR
      uses: korthout/backport-action@v3.4.1
      with:
        source_pr_number: ${{ inputs.pr-number }}   # drives both the event and manual-dispatch paths
        target_branches: ${{ inputs.target-branch }}
        github_token: ${{ github.token }}
        merge_commits: fail                          # squash is enforced; a 2-parent commit fails loudly
        experimental: '{"conflict_resolution": "draft_commit_conflicts"}'  # always open a PR; draft + instructions on conflict
        add_labels: backport                         # so the weekly patch-release workflow can find these PRs
        add_author_as_assignee: true                 # original author resolves conflicts / shepherds the backport
        # Defaults already match our design:
        #   pull_title  = [Backport <target>] <original title>
        #   branch_name = backport-<pr>-to-<target>   (deterministic => idempotent re-runs)
